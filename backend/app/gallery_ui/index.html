<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AMAZING RACE 2026 — Photo Gallery</title>
  <link rel="stylesheet" href="/gallery/assets/gallery.css">
</head>
<body class="gallery-page" data-photo-gallery>
  <header class="event-header">
    <div class="official-event-art" role="img" aria-label="AMAZING RACE 2026 with BK and MONASH UNIVERSITY logos"></div>
    <p class="event-label">Photo Gallery</p>
    <h1>AMAZING RACE <span>2026</span></h1>
  </header>
  <main>
    <section id="photoGrid" class="photo-grid" aria-label="Event photos" aria-busy="true"></section>
    <div id="galleryEmpty" class="empty-state" hidden><h2>No photos yet</h2></div>
    <nav id="pagination" class="pagination" aria-label="Gallery pages"></nav>
    <p id="galleryFeedback" role="status" hidden></p>
    <button id="retryGallery" type="button" hidden>Retry</button>
  </main>
  <script type="module" src="/gallery/assets/gallery.js"></script>
</body>
</html>
