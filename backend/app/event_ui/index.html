<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>AMAZING RACE 2026 — Event Live Gallery</title>
<link rel="stylesheet" href="/event-display/assets/display.css"></head>
<body><header><h1>AMAZING RACE 2026</h1><p>PHOTOBOOTH · LIVE GALLERY</p></header>
<main>
<section id="displayLogin" aria-labelledby="loginTitle"><form id="displayLoginForm">
<h2 id="loginTitle">Event Display</h2><p>Enter the display code provided in the Host Dashboard.</p>
<label for="displayCode">Display Code</label><input id="displayCode" type="password" required maxlength="200" autocomplete="off">
<button type="submit">Open Display</button><p id="displayLoginError" role="alert"></p>
</form></section>
<section id="displayPresentation" hidden aria-label="Approved photos">
<p id="displayStatus" role="status" aria-live="polite">Connecting…</p>
<div id="displayEmpty"><h2>Waiting for the first moments</h2><p>Finalized photos approved by the host will appear automatically.</p></div>
<div id="photoWall" aria-label="Photo gallery"></div>
</section>
</main><script type="module" src="/event-display/assets/display.js"></script></body></html>
