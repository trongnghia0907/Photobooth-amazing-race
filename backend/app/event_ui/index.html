<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>AMAZING RACE 2026 — Event Display</title>
<link rel="stylesheet" href="/event-display/assets/display.css"></head>
<body><div class="official-event-art" role="img" aria-label="AMAZING RACE 2026 with HCMUT, Monash University and Amazing Race logos"></div>
<main>
<section id="displayLogin" aria-labelledby="loginTitle" hidden><form id="displayLoginForm">
<h2 id="loginTitle">Event Display</h2><p>Enter the display code from event staff.</p>
<label for="displayCode">Display Code</label><input id="displayCode" type="password" required maxlength="200" autocomplete="off">
<button type="submit">Open Display</button><p id="displayLoginError" role="alert"></p>
</form></section>
<section id="displayPresentation" aria-label="Event Photos">
<p id="displayStatus" role="status" aria-live="polite">Connecting…</p>
<div id="displayEmpty" hidden><h2>Waiting for the first photo</h2></div>
<div id="photoWall" aria-label="Photo Wall"></div>
</section>
</main><script type="module" src="/event-display/assets/display.js"></script></body></html>
